name: Gerar APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      # A chave fica no Secret KEYSTORE_BASE64 (Settings → Secrets and variables → Actions).
      # Sem ela o APK sairia com outra assinatura e o celular não aceitaria a atualização.
      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta o Secret KEYSTORE_BASE64. Veja a seção 'Chave de assinatura' no README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > app/estoque.keystore

      - name: Gerar APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Apagar a chave do runner
        if: always()
        run: rm -f app/estoque.keystore

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ContagemEstoque-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
